name: Keep Render Alive
on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Random ping
        run: |
          DELAY=$(( (RANDOM % 9) * 60 ))
          echo "Waiting ${DELAY}s before ping..."
          sleep $DELAY
          echo "Pinging..."
          curl -L https://plumber-erx4.onrender.com/
